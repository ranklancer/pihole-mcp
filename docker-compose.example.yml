# Example Docker Compose for pihole-mcp
#
# Copy to docker-compose.yml, create a .env from .env.example,
# and create secrets files (or use env vars directly).

services:
  pihole-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pihole-mcp
    # --- If using Docker secrets for passwords: ---
    entrypoint:
      - sh
      - -c
      - |
        export PIHOLE_PASSWORD=$$(cat /run/secrets/pihole_password)
        # Uncomment for additional instances:
        # export PIHOLE2_PASSWORD=$$(cat /run/secrets/pihole2_password)
        exec node dist/index.js
    environment:
      NODE_ENV: production
      # The container must bind all interfaces so the published port reaches it.
      # A non-loopback bind is refused unless MCP_ALLOW_NON_LOOPBACK is "true".
      HOST: 0.0.0.0
      MCP_ALLOW_NON_LOOPBACK: "true"
      PORT: "3000"
      # Bearer token required on /mcp. A non-loopback bind without a token is
      # refused unless MCP_ALLOW_UNAUTHENTICATED is "true" (not recommended:
      # any container on the same Docker network could then manage your Pi-hole).
      MCP_AUTH_TOKEN_FILE: /run/secrets/mcp_auth_token
      # MCP_ALLOW_UNAUTHENTICATED: "true"
      # Extra hostnames accepted in the Host header (DNS-rebinding protection).
      # localhost, 127.0.0.1 and [::1] are always accepted, which covers the
      # 127.0.0.1 port mapping below. Add the service name if other containers
      # call http://pihole-mcp:3000/mcp, and the LAN name/IP if you publish wider:
      # MCP_ALLOWED_HOSTS: pihole-mcp,pihole-mcp.lan
      TZ: ${TZ:-UTC}
      PIHOLE_INSTANCES: ${PIHOLE_INSTANCES:-pihole}
      PIHOLE_BASE_URL: ${PIHOLE_BASE_URL}
      # Uncomment for additional instances:
      # PIHOLE2_BASE_URL: ${PIHOLE2_BASE_URL}
      # PIHOLE2_INSECURE_TLS: "true"
    secrets:
      - pihole_password
      # - pihole2_password
      - mcp_auth_token
    ports:
      - "127.0.0.1:3031:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid
    mem_limit: 256m
    cpus: 0.3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  pihole_password:
    file: ./secrets/pihole_password
  # pihole2_password:
  #   file: ./secrets/pihole2_password
  # Generate with: openssl rand -hex 32 > secrets/mcp_auth_token
  mcp_auth_token:
    file: ./secrets/mcp_auth_token
